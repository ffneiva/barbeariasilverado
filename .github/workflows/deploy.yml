name: 🪒 Deploy — Barbearia Silverado

on:
  push:
    branches: [main]
  workflow_dispatch:

# Um deploy por vez. Se dois commits caírem juntos, o segundo espera em vez de
# disputar o mesmo bucket — e o primeiro é cancelado, porque só interessa o
# estado final.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # necessário para o OIDC trocar o token do GitHub por credenciais AWS

jobs:
  deploy:
    name: Build & publicar
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://barbeariasilverado.com.br

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v5

      - name: 🟢 Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      # Horário e grade de agendamento são a única lógica de negócio do site —
      # e a única cujo bug manda um cliente para uma barbearia fechada.
      - name: 🧪 Verificar horários e agendamento
        run: npm run check

      # `vite build` e `vite dev` resolvem módulos por caminhos diferentes — dá
      # para ter build verde e `npm run dev` quebrando no primeiro import. Este
      # passo sobe o dev server de verdade e percorre o grafo a partir da entrada.
      - name: 🖥️ Smoke test do dev server
        run: npm run check:dev

      - name: 🏗️ Build
        run: npm run build

      # As credenciais são temporárias (1h) e emitidas na hora pelo STS a partir
      # do token OIDC do GitHub. Não existe access key guardada em lugar nenhum.
      - name: 🔐 Assumir a role na AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # 1) Tudo que tem hash no nome (ou muda junto com o deploy) pode ser
      #    cacheado para sempre — o nome muda quando o conteúdo muda.
      - name: 📤 Assets (cache imutável)
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET_NAME }}" \
            --delete \
            --no-progress \
            --exclude "*index.html" \
            --exclude "robots.txt" \
            --exclude "sitemap.xml" \
            --exclude "site.webmanifest" \
            --exclude "google*.html" \
            --cache-control "public,max-age=31536000,immutable"

      # 2) O AWS CLI adivinha o Content-Type pelo mimetypes do Python, que não
      #    conhece .webp nem .woff2 — sem isto eles subiriam como
      #    binary/octet-stream. Uma segunda passada corrige só esses tipos.
      - name: 🏷️ Corrigir Content-Type de webp e woff2
        run: |
          aws s3 cp "s3://${{ vars.S3_BUCKET_NAME }}/images" "s3://${{ vars.S3_BUCKET_NAME }}/images" \
            --recursive --no-progress \
            --exclude "*" --include "*.webp" \
            --content-type "image/webp" \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE

          aws s3 cp "s3://${{ vars.S3_BUCKET_NAME }}/fonts" "s3://${{ vars.S3_BUCKET_NAME }}/fonts" \
            --recursive --no-progress \
            --exclude "*" --include "*.woff2" \
            --content-type "font/woff2" \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE

      # 3) Os index.html referenciam os assets com hash: se ficarem em cache,
      #    o visitante continua vendo a versão antiga do site.
      #
      #    São vários agora — o build gera um por rota (dist/agendar/index.html
      #    e afins) mais o dist/404.html, cada um com título, description e
      #    canonical próprios. O laço evita que uma rota nova seja esquecida.
      #
      #    Os arquivos de verificação de propriedade também são .html, mas têm
      #    passo próprio (cache diferente) e ficam de fora daqui.
      - name: 📤 HTML de todas as rotas (sem cache)
        run: |
          while IFS= read -r f; do
            KEY="${f#dist/}"
            aws s3 cp "$f" "s3://${{ vars.S3_BUCKET_NAME }}/$KEY" \
              --no-progress \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache,must-revalidate"
            echo "publicado: /$KEY"
          done < <(find dist -name '*.html' -not -name 'google*')

      - name: 📤 Arquivos de SEO e manifest
        run: |
          aws s3 cp dist/robots.txt "s3://${{ vars.S3_BUCKET_NAME }}/robots.txt" \
            --no-progress --content-type "text/plain; charset=utf-8" \
            --cache-control "public,max-age=3600"

          aws s3 cp dist/sitemap.xml "s3://${{ vars.S3_BUCKET_NAME }}/sitemap.xml" \
            --no-progress --content-type "application/xml; charset=utf-8" \
            --cache-control "public,max-age=3600"

          aws s3 cp dist/site.webmanifest "s3://${{ vars.S3_BUCKET_NAME }}/site.webmanifest" \
            --no-progress --content-type "application/manifest+json" \
            --cache-control "public,max-age=86400"

      # Arquivos de verificação de propriedade (Google Search Console e afins).
      # Cache curto de propósito: se o token for trocado, o novo precisa valer
      # na hora — um `immutable` de um ano deixaria o Google lendo o antigo.
      - name: 📤 Arquivos de verificação
        run: |
          shopt -s nullglob
          for f in dist/google*.html; do
            aws s3 cp "$f" "s3://${{ vars.S3_BUCKET_NAME }}/$(basename "$f")" \
              --no-progress --content-type "text/html; charset=utf-8" \
              --cache-control "public,max-age=300"
            echo "publicado: $(basename "$f")"
          done

      - name: 🔄 Invalidar o CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidação criada: $ID"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"

      # Confere que o site respondeu 200 antes de declarar sucesso — um deploy
      # verde com o site fora do ar é pior do que um deploy vermelho.
      #
      # Enquanto o DNS do domínio próprio não estiver apontado, testar
      # barbeariasilverado.com.br deixaria TODO deploy vermelho por um motivo que
      # não é do deploy. Então o teste cai para o endereço do CloudFront, que é
      # sempre válido, e avisa em vez de falhar.
      - name: ✅ Smoke test
        run: |
          CF_DOMAIN=$(aws cloudfront get-distribution \
            --id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --query 'Distribution.DomainName' --output text)

          check() { curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$1" 2>/dev/null || echo "000"; }

          STATUS=$(check "https://barbeariasilverado.com.br/")
          if [ "$STATUS" = "200" ]; then
            echo "✅ https://barbeariasilverado.com.br/ → 200"
            echo "SITE_URL=https://barbeariasilverado.com.br" >> "$GITHUB_ENV"

            # As páginas de anúncio precisam responder com o título DELAS. Se a
            # reescrita da CloudFront Function quebrar, a URL ainda devolve 200
            # — só que com a home inteira dentro. Conferir o título pega isso.
            for rota in agendar loja; do
              TITULO=$(curl -s --max-time 20 "https://barbeariasilverado.com.br/$rota" | grep -o '<title>[^<]*</title>')
              echo "  /$rota → $TITULO"
              case "$TITULO" in
                *"$rota"*|*Agendar*|*Loja*) ;;
                *) echo "::error::/$rota não está servindo o HTML próprio da rota"; exit 1 ;;
              esac
            done
            exit 0
          fi

          echo "::warning::O domínio próprio respondeu $STATUS. Testando o endereço do CloudFront."
          STATUS=$(check "https://$CF_DOMAIN/")
          echo "https://$CF_DOMAIN/ → $STATUS"
          echo "SITE_URL=https://$CF_DOMAIN" >> "$GITHUB_ENV"
          test "$STATUS" = "200"

      # A distribuição devolve o index.html em qualquer 404, para as rotas da
      # SPA funcionarem. O efeito colateral é que um arquivo de verificação
      # ausente responderia 200 com o HTML do site, e o Search Console falharia
      # com "conteúdo não confere" sem dizer que o arquivo sumiu. Aqui o
      # conteúdo é comparado byte a byte.
      - name: 🔎 Conferir arquivos de verificação
        run: |
          shopt -s nullglob
          for f in dist/google*.html; do
            NAME=$(basename "$f")
            REMOTO=$(curl -s --max-time 20 "$SITE_URL/$NAME")
            if [ "$REMOTO" = "$(cat "$f")" ]; then
              echo "✅ $NAME confere"
            else
              echo "::error::$NAME não confere. Servido: $(echo "$REMOTO" | head -c 120)"
              exit 1
            fi
          done

      - name: 📋 Resumo
        run: |
          {
            echo "### 🪒 Deploy concluído"
            echo ""
            echo "- **Site:** $SITE_URL"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Bucket:** \`${{ vars.S3_BUCKET_NAME }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
